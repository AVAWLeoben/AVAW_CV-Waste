name: Build JOSS paper

on:
  push:
    paths:
      - "JOSS/**"
      - ".github/workflows/joss-paper.yml"
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build JOSS paper
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: JOSS/paper.md
