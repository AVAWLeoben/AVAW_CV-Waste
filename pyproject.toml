# pyproject.toml
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avaw-cv-waste"
version = "1.1.2"
description = "Offline GUI tool for YOLO-style bounding box annotation in waste-management research"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Gerald Koinig" },
  { name = "Bojan Lorber" }
]
dependencies = [
  "numpy",
  "pillow",
  "opencv-python",
  "natsort",
  "ultralytics"
]

[project.urls]
Homepage = "https://github.com/AVAWLeoben/AVAW_CV-Waste"
Repository = "https://github.com/AVAWLeoben/AVAW_CV-Waste"
Issues = "https://github.com/AVAWLeoben/AVAW_CV-Waste/issues"

[project.gui-scripts]
avaw-cv-waste = "AVAW_BBOX.AVAW_CVAT_BBOX:initialize_bbox_app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["AVAW_BBOX*"]

[tool.setuptools.package-data]
AVAW_BBOX = [
  "files_bbox/*",
  "annotations_bbox/*",
  "test_model.pt"
]
